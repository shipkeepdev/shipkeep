rules:
  - id: go-no-shell-interpreter
    languages: [go]
    severity: ERROR
    message: >-
      Shipkeep never runs a shell. Use the Docker Engine API, the Caddy admin API,
      or exec with a literal argv allow list (see CLAUDE.md, rule 1).
    pattern-either:
      - pattern: exec.Command("sh", ...)
      - pattern: exec.Command("bash", ...)
      - pattern: exec.Command("/bin/sh", ...)
      - pattern: exec.Command("/bin/bash", ...)
      - pattern: exec.CommandContext($CTX, "sh", ...)
      - pattern: exec.CommandContext($CTX, "bash", ...)
      - pattern: exec.CommandContext($CTX, "/bin/sh", ...)
      - pattern: exec.CommandContext($CTX, "/bin/bash", ...)

  - id: go-exec-non-literal-binary
    languages: [go]
    severity: ERROR
    message: >-
      The program passed to exec.Command must be a string literal from an allow list.
    patterns:
      - pattern-either:
          - pattern: exec.Command($BIN, ...)
          - pattern: exec.CommandContext($CTX, $BIN, ...)
      - pattern-not: exec.Command("...", ...)
      - pattern-not: exec.CommandContext($CTX, "...", ...)

  - id: ts-no-child-process
    languages: [typescript]
    severity: ERROR
    message: >-
      Do not spawn processes from the control plane. It talks to agents through typed gRPC actions.
    pattern-either:
      - pattern: import $X from "child_process"
      - pattern: import $X from "node:child_process"
      - pattern: import {...} from "child_process"
      - pattern: import {...} from "node:child_process"
      - pattern: import * as $X from "child_process"
      - pattern: import * as $X from "node:child_process"
      - pattern: require("child_process")
      - pattern: require("node:child_process")
      - pattern: import $X from "execa"
      - pattern: import {...} from "execa"
      - pattern: import $X from "shelljs"

  - id: ts-no-prisma-unsafe-raw
    languages: [typescript]
    severity: ERROR
    message: >-
      Use Prisma.sql tagged templates ($queryRaw / $executeRaw), never the Unsafe variants.
    pattern-either:
      - pattern: $P.$queryRawUnsafe(...)
      - pattern: $P.$executeRawUnsafe(...)
