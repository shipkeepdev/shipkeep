# Local development stack for the control plane (task M0.5). Start with `pnpm dev:infra`.
# Images are pinned to digests (THREAT_MODEL, supply chain); Renovate keeps them current.
# Every port binds to 127.0.0.1 only: this stack must never be reachable from the network.
# Host ports can be moved with SHIPKEEP_DEV_*_PORT variables (copy .env.example to .env) when a
# port is already taken on the developer machine.
name: shipkeep-dev

services:
  postgres:
    image: postgres:17@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
    environment:
      POSTGRES_USER: shipkeep
      POSTGRES_PASSWORD: shipkeep
      POSTGRES_DB: shipkeep
    ports:
      - '127.0.0.1:${SHIPKEEP_DEV_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shipkeep -d shipkeep']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  victorialogs:
    image: victoriametrics/victoria-logs:v1.54.0@sha256:ee4e820cac3721f5f5d91641b950c22439593adc4224f9655e5333d5a84c1dfe
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=30d
      - -httpListenAddr=:9428
    ports:
      - '127.0.0.1:${SHIPKEEP_DEV_VICTORIALOGS_PORT:-9428}:9428'
    volumes:
      - victorialogs-data:/victoria-logs-data
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.157.0@sha256:322a7a92fdcc269280e9c38af94c83bc76827a31b792acbc60e44394e7f29c20
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=30d
      - -httpListenAddr=:8428
    ports:
      - '127.0.0.1:${SHIPKEEP_DEV_VICTORIAMETRICS_PORT:-8428}:8428'
    volumes:
      - victoriametrics-data:/victoria-metrics-data
    restart: unless-stopped

  registry:
    # CNCF Distribution (ADR 0012). Loopback only until WireGuard lands (M4.1).
    image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
    ports:
      - '127.0.0.1:${SHIPKEEP_DEV_REGISTRY_PORT:-5000}:5000'
    volumes:
      - registry-data:/var/lib/registry
    restart: unless-stopped

volumes:
  postgres-data:
  victorialogs-data:
  victoriametrics-data:
  registry-data:
