# Control plane on one server (task M8.3b2). See docs/INSTALL.md.
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d
#
# Start order: PostgreSQL, then three one-shot steps (key-encryption key, migrations, restricted
# database login), then the control plane and its HTTPS front. The one-shot steps run again at
# every `up`, and change nothing when there is nothing to do.
# Images are pinned to digests (THREAT_MODEL, supply chain); Renovate keeps them current.
name: shipkeep

# SHIPKEEP_IMAGE names the release by tag and digest. A tag alone can be repointed in the registry;
# the digest cannot, and these containers hold the database administrator URL and the key file.
x-shipkeep: &shipkeep
  image: ${SHIPKEEP_IMAGE:?set SHIPKEEP_IMAGE in .env}

x-admin-url: &admin-url postgresql://shipkeep_admin:${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}@postgres:5432/shipkeep
x-app-url: &app-url postgresql://shipkeep_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@postgres:5432/shipkeep

services:
  postgres:
    image: postgres:17@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
    # TCP keepalives end a half-open session within two minutes (#429). `up -d` with a new image
    # recreates `net` before it stops the old control plane, whose connections then never close:
    # without them, PostgreSQL keeps those sessions about two hours, holding connection slots and
    # the database a restore renames.
    command:
      - postgres
      - -c
      - tcp_keepalives_idle=60
      - -c
      - tcp_keepalives_interval=10
      - -c
      - tcp_keepalives_count=6
    environment:
      POSTGRES_USER: shipkeep_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: shipkeep
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during first-time initialization PostgreSQL answers on its Unix socket only,
      # before it accepts the connections the next steps make.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U shipkeep_admin -d shipkeep']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  kek:
    <<: *shipkeep
    command: ['node', 'setup/ensure-kek.mjs']
    environment:
      SHIPKEEP_KEK_FILE: /var/lib/shipkeep/kek
    volumes:
      - keys:/var/lib/shipkeep
    restart: 'no'

  migrate:
    <<: *shipkeep
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy', '--config', 'prisma.config.ts']
    environment:
      MIGRATION_DATABASE_URL: *admin-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  database-role:
    <<: *shipkeep
    command: ['node', 'postgres/provision-runtime.mjs']
    environment:
      MIGRATION_DATABASE_URL: *admin-url
      DATABASE_URL: *app-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  # Holds the network namespace that the control plane and Caddy share, and the published ports.
  # It does nothing else, so it does not restart: either of the two can restart or crash without
  # cutting the other off. (A container that joins another one's namespace loses it when that
  # one restarts.)
  net:
    <<: *shipkeep
    command: ['node', '-e', 'setInterval(() => {}, 2147483647)']
    healthcheck:
      disable: true
    ports:
      # 80 and 443 are served by Caddy.
      - '80:80'
      - '443:443'
      - '443:443/udp'
      # Agent gateway: gRPC over mutual TLS, terminated by the control plane itself.
      - '7443:7443'
    # The control plane shares this namespace: it alone reaches VictoriaLogs, on `logs`.
    networks:
      - default
      - logs
    restart: unless-stopped

  control-plane:
    <<: *shipkeep
    environment:
      API_PUBLIC_URL: https://${SHIPKEEP_DOMAIN:?set SHIPKEEP_DOMAIN in .env}
      # Only Caddy, on loopback in the shared network namespace, reaches the API port.
      TRUST_PROXY: loopback
      DATABASE_URL: *app-url
      SHIPKEEP_KEK_FILE: /var/lib/shipkeep/kek
      AGENT_GATEWAY_ADDR: 0.0.0.0:7443
      AGENT_GATEWAY_SERVER_NAME: ${SHIPKEEP_DOMAIN:?set SHIPKEEP_DOMAIN in .env}
      # Email is optional (ADR 0020): without SMTP_HOST the installation sends none, and accounts
      # are created on this server with `node main.js account create`.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      VICTORIALOGS_URL: http://victorialogs:9428
      # The public key of the registry's tokens, written at start for the registry (ADR 0030).
      REGISTRY_JWKS_FILE: /var/lib/shipkeep-registry/jwks.json
      # The registry's API on the Compose network, for image retention (ADR 0030).
      REGISTRY_URL: http://registry:5000
    volumes:
      - keys:/var/lib/shipkeep:ro
      - registry-auth:/var/lib/shipkeep-registry
    network_mode: service:net
    depends_on:
      net:
        condition: service_started
      kek:
        condition: service_completed_successfully
      database-role:
        condition: service_completed_successfully
    restart: unless-stopped

  # Instance backup (ADR 0026): backup.sh runs it, never `up`. It creates and opens the encrypted
  # archive of the database and the key-encryption key; pg_dump and pg_restore run in the postgres
  # container and reach it through pipes. No network: it needs none.
  backup:
    <<: *shipkeep
    profiles: [backup]
    entrypoint: ['node', 'backup.js']
    environment:
      SHIPKEEP_KEK_FILE: /var/lib/shipkeep/kek
      # What `./backup.sh keygen` leaves here: the public key backups are encrypted to, and the key
      # that proves they come from this server. Not the identity, which is kept elsewhere.
      SHIPKEEP_BACKUP_KEY_FILE: /var/lib/shipkeep/backup-key
    volumes:
      # Written by keygen (the backup key) and by a restore (both keys).
      - keys:/var/lib/shipkeep
    network_mode: none
    restart: 'no'

  # Moves encrypted archives to and from an S3-compatible storage (ADR 0026). It has the network
  # the storage needs and no volume: it never sees the key-encryption key, nor anything in clear.
  backup-transfer:
    <<: *shipkeep
    profiles: [backup]
    entrypoint: ['node', 'backup.js']
    environment:
      SHIPKEEP_BACKUP_S3_ENDPOINT: ${SHIPKEEP_BACKUP_S3_ENDPOINT:-}
      SHIPKEEP_BACKUP_S3_REGION: ${SHIPKEEP_BACKUP_S3_REGION:-}
      SHIPKEEP_BACKUP_S3_BUCKET: ${SHIPKEEP_BACKUP_S3_BUCKET:-}
      SHIPKEEP_BACKUP_S3_PREFIX: ${SHIPKEEP_BACKUP_S3_PREFIX:-shipkeep/}
      SHIPKEEP_BACKUP_S3_ACCESS_KEY_ID: ${SHIPKEEP_BACKUP_S3_ACCESS_KEY_ID:-}
      SHIPKEEP_BACKUP_S3_SECRET_ACCESS_KEY: ${SHIPKEEP_BACKUP_S3_SECRET_ACCESS_KEY:-}
      SHIPKEEP_BACKUP_S3_ALLOW_HTTP: ${SHIPKEEP_BACKUP_S3_ALLOW_HTTP:-false}
    restart: 'no'

  # Metrics the agents report through the control plane (ADR 0024). Internal network only: no port is
  # published, and only the API reads it. Losing it loses history, not state.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.157.0@sha256:322a7a92fdcc269280e9c38af94c83bc76827a31b792acbc60e44394e7f29c20
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=30d
      - -httpListenAddr=:8428
      - -memory.allowedBytes=256MiB
    volumes:
      - victoriametrics-data:/victoria-metrics-data
    restart: unless-stopped

  # Container logs (ADR 0029): agents send them to the API, which writes them here with labels it
  # sets itself, and reads them back for the interface. Logs can hold what an application printed,
  # secrets included, and VictoriaLogs has no authentication: it is alone on the `logs` network,
  # which only the control plane's namespace joins, and publishes no port.
  victorialogs:
    image: victoriametrics/victoria-logs:v1.54.0@sha256:ee4e820cac3721f5f5d91641b950c22439593adc4224f9655e5333d5a84c1dfe
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=30d
      # The disk is shared with PostgreSQL: past 80 % of it in use, the oldest days of logs are
      # dropped, and below 1 GiB free no line is accepted (agents send it again later).
      - -retention.maxDiskUsagePercent=80
      - -storage.minFreeDiskSpaceBytes=1GiB
      - -httpListenAddr=:9428
      - -memory.allowedBytes=256MiB
      # Searches are bounded so that memory stays within the single machine's limit.
      - -search.maxConcurrentRequests=4
      - -search.maxQueryDuration=10s
    volumes:
      - victorialogs-data:/victoria-logs-data
    networks:
      - logs
    restart: unless-stopped

  # The installation's registry (ADR 0030): the images builds push, served under /v2/ on the control
  # plane's name, by Caddy here and by the server's Caddy on a single machine. No request gets in
  # without a token the control plane signed: it starts once the control plane wrote their key.
  # Images are not in the instance backup: each one can be built again from its commit.
  registry:
    image: registry:3.1.2@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
    environment:
      REGISTRY_AUTH_TOKEN_REALM: https://${SHIPKEEP_DOMAIN:?set SHIPKEEP_DOMAIN in .env}/api/v1/registry/token
      REGISTRY_AUTH_TOKEN_SERVICE: ${SHIPKEEP_DOMAIN:?set SHIPKEEP_DOMAIN in .env}
    volumes:
      - ./registry.yml:/etc/distribution/config.yml:ro
      - registry-auth:/auth:ro
      - registry-data:/var/lib/registry
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    network_mode: service:net
    environment:
      SHIPKEEP_DOMAIN: ${SHIPKEEP_DOMAIN:?set SHIPKEEP_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
  # No route out, and no container but VictoriaLogs and the control plane's namespace.
  logs:
    internal: true

volumes:
  postgres-data:
  victoriametrics-data:
  victorialogs-data:
  keys:
  caddy-data:
  caddy-config:
  registry-auth:
  registry-data:
