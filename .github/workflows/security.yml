name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    # Code scanning on private repositories needs a paid GitHub Code Security license.
    # Set the repository variable ENABLE_CODEQL=true when the repository becomes public (v1).
    # Semgrep and gosec cover the gap until then.
    if: ${{ vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, go]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  semgrep:
    name: Semgrep (custom rules + OWASP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the codebase
        run: >-
          semgrep scan --config .semgrep/shipkeep-rules.yml
          --config p/owasp-top-ten --config p/golang --config p/typescript
          --exclude .semgrep/tests --metrics=off --error
      - name: Test the custom rules
        if: ${{ hashFiles('.semgrep/tests/**') != '' }}
        run: semgrep --test .semgrep

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: securego/gosec@master
        with:
          args: ./agent/... ./cli/... ./lib/...

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action needs a license for organization accounts; the CLI image does not.
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest
          git /repo --redact --exit-code 1

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # trivy-action tags 0.0.1 to 0.34.2 were force-pushed to malware in March 2026 (CVE-2026-33634).
      # v0.35.0 is the known safe release. Task M0.2 replaces this tag with its full commit SHA.
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
