name: release

# Runs on version tags. A manual run (workflow_dispatch) is a dry run: it builds snapshot binaries
# and the image, and publishes and signs nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Only a pushed version tag publishes. A manual run stays a dry run even when it is started on a tag.
env:
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}

jobs:
  binaries:
    name: Agent and CLI binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: ${{ env.PUBLISH == 'true' && 'release --clean' || 'release --snapshot --clean --skip=sign' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  control-plane-image:
    name: Control plane image
    # The last step adds the image reference to the release that the binaries job creates.
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runtime stage installs native modules for arm64 under emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v9.2.2-52@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/shipkeep
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/control-plane.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
      - if: env.PUBLISH == 'true'
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/shipkeep@${{ steps.build.outputs.digest }}"
      # docs/INSTALL.md asks operators for the image by tag and digest: publish that exact line.
      - name: Record the image reference
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/shipkeep
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$PUBLISH" != true ]; then
            # Nothing was pushed: a reference here would name an image that does not exist.
            printf '## Dry run\n\nThe control plane image was built and not pushed.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$VERSION" ] || [ -z "$DIGEST" ]; then
            echo "The image version or digest is missing." >&2
            exit 1
          fi
          reference="${IMAGE}:${VERSION}@${DIGEST}"
          # Three backticks, written by code so that the script holds no literal fence.
          fence=$(printf '\140\140\140')
          block=$(printf '## Control plane image\n\n%s\nSHIPKEEP_IMAGE=%s\n%s' "$fence" "$reference" "$fence")
          printf '%s\n' "$block" >> "$GITHUB_STEP_SUMMARY"
          {
            gh release view "$TAG" --json body --jq .body
            printf '\n%s\n' "$block"
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
