name: proto

on:
  pull_request:
    paths:
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'

permissions:
  contents: read
  pull-requests: write

jobs:
  buf:
    name: buf lint and breaking
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          lint: true
          format: true
          breaking: false
          push: false
      # Breaking-change detection against main. Skipped only while main has no proto files yet.
      - name: buf breaking
        env:
          AGAINST: '${{ github.event.repository.clone_url }}#branch=main'
        run: |
          git fetch --quiet origin main
          if git ls-tree -r --name-only origin/main -- proto | grep -q '\.proto$'; then
            buf breaking --against "$AGAINST"
          else
            echo "main has no .proto files yet, nothing to compare against"
          fi
