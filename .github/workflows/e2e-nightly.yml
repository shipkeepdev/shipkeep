name: e2e-nightly

on:
  schedule:
    - cron: '41 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  e2e:
    name: End-to-end on real VMs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      E2E_RUN_ID: e2e-${{ github.run_id }}
    steps:
      - name: Skip when the VM provider token is not configured
        if: env.HCLOUD_TOKEN == ''
        run: echo "HCLOUD_TOKEN not set, skipping." && exit 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HCLOUD_TOKEN != ''
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.HCLOUD_TOKEN != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HCLOUD_TOKEN != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.HCLOUD_TOKEN != ''
        with:
          go-version-file: agent/go.mod
      - if: env.HCLOUD_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - name: Provision VMs
        if: env.HCLOUD_TOKEN != ''
        run: pnpm e2e:provision
      - name: Run scenarios
        if: env.HCLOUD_TOKEN != ''
        run: pnpm e2e:run
      - name: Tear down VMs (always)
        if: always() && env.HCLOUD_TOKEN != ''
        run: pnpm e2e:teardown
