name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read # nx-set-shas reads earlier workflow runs to find the last green commit on main.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: tools/ci/check-dco.test.sh
      - run: tools/ci/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  typescript:
    name: TypeScript (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The web build also produces the node installer artifacts (deploy/build-installer.sh).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: |
            agent/go.sum
            cli/go.sum
            lib/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      - run: pnpm nx affected -t lint typecheck test build --parallel=3

  installer:
    name: Node installer scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck deploy/*.sh deploy/control-plane/*.sh
      - run: bash deploy/install_test.sh
      # Reads the settings file back from a real container: it uses the runner's Docker.
      - run: bash deploy/control-plane/install_test.sh

  go:
    name: Go (lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: |
            agent/go.sum
            cli/go.sum
            lib/go.sum
      # golangci-lint v2 is required by .golangci.yml (config version 2). Keep `version` in sync with the local toolchain.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15
          working-directory: lib
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15
          working-directory: agent
          install-mode: none
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15
          working-directory: cli
          install-mode: none
      - run: go test -race -count=1 ./agent/... ./cli/... ./lib/...
      - name: Every fuzz target runs nightly
        run: |
          missing=$(git grep -h -o '^func Fuzz[A-Za-z0-9_]*' -- '*.go' | sed 's/^func //' | while read -r target; do
            grep -q "target: $target }" .github/workflows/fuzz-nightly.yml || echo "$target"
          done)
          if [ -n "$missing" ]; then
            echo "Fuzz targets missing from fuzz-nightly.yml: $missing"
            exit 1
          fi
      - name: Agent binary size budget (30 MB, PLAN M1.1)
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /tmp/shipkeep-agent ./agent/cmd/shipkeep-agent
          size=$(stat -c%s /tmp/shipkeep-agent)
          echo "shipkeep-agent is $size bytes"
          test "$size" -lt 31457280

  agent-real:
    # Acceptance of M1.4 and M1.5 (#16, #17): the agent's own handlers against the runner's Docker,
    # and a route switched under constant load in the Caddy that compose.yml pins.
    name: Agent against Docker and Caddy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: |
            agent/go.sum
            lib/go.sum
      - name: Start Caddy on the test network
        # As the runner's user, so that the test reaches the admin socket in the shared directory.
        # The network carries the managed label: the agent's EnsureNetwork then adopts it.
        run: |
          mkdir -p "$RUNNER_TEMP/caddy"
          printf '{"admin":{"listen":"unix//run/caddy/admin.sock"}}\n' > "$RUNNER_TEMP/caddy/config.json"
          image=$(sed -n 's/^ *image: \(caddy:[^ ]*\)$/\1/p' deploy/control-plane/compose.yml)
          test -n "$image"
          docker network create --label sk.managed=true sk-it
          docker run -d --name sk-it-caddy --network sk-it --user "$(id -u):$(id -g)" \
            -e XDG_CONFIG_HOME=/run/caddy/config -e XDG_DATA_HOME=/run/caddy/data \
            -v "$RUNNER_TEMP/caddy:/run/caddy" "$image" caddy run --config /run/caddy/config.json
          for _ in $(seq 1 30); do
            test -S "$RUNNER_TEMP/caddy/admin.sock" && break
            sleep 1
          done
          test -S "$RUNNER_TEMP/caddy/admin.sock"
          address=$(docker inspect --format '{{(index .NetworkSettings.Networks "sk-it").IPAddress}}' sk-it-caddy)
          echo "SHIPKEEP_IT_CADDY_ADMIN=$RUNNER_TEMP/caddy/admin.sock" >> "$GITHUB_ENV"
          echo "SHIPKEEP_IT_CADDY_ADDRESS=$address:80" >> "$GITHUB_ENV"
      - name: Start BuildKit and a registry on the test network
        # ADR 0030: BuildKit builds this repository from GitHub at the commit under test and pushes
        # to a registry it reaches over plain HTTP on the test network.
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/buildkit"
          # The frontends deploy/install.sh allows (#544), so that the builds below run under them.
          {
            printf '[registry."sk-it-registry:5000"]\n  http = true\n'
            sed -n '/^\[frontend\./,/^CONFIG$/p' deploy/install.sh | grep -v '^CONFIG$' | grep -v '^#'
          } > "$RUNNER_TEMP/buildkit/buildkitd.toml"
          registry=$(sed -n 's/^ *image: \(registry:[^ ]*\)$/\1/p' deploy/control-plane/compose.yml)
          test -n "$registry"
          docker run -d --name sk-it-registry --network sk-it -p 127.0.0.1:5000:5000 "$registry"
          docker run -d --name sk-it-buildkit --network sk-it --privileged -p 127.0.0.1:1234:1234 \
            -v "$RUNNER_TEMP/buildkit/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro" \
            moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c --addr tcp://0.0.0.0:1234
          for _ in $(seq 1 30); do
            docker logs sk-it-buildkit 2>&1 | grep -q 'running server' && break
            sleep 1
          done
          {
            echo "SHIPKEEP_IT_BUILDKIT=tcp://127.0.0.1:1234"
            echo "SHIPKEEP_IT_BUILD_REGISTRY=sk-it-registry:5000"
            echo "SHIPKEEP_IT_BUILD_REGISTRY_URL=http://127.0.0.1:5000"
            echo "SHIPKEEP_IT_BUILD_REPOSITORY=https://github.com/$REPOSITORY.git"
            echo "SHIPKEEP_IT_BUILD_COMMIT=$COMMIT"
          } >> "$GITHUB_ENV"
      - run: go test -tags integration -count=1 -v -run '^TestReal' ./agent/internal/actions/ ./agent/internal/docker/ ./agent/internal/logship/ ./agent/internal/buildkit/
      - name: Caddy, BuildKit and registry logs
        if: failure()
        run: |
          docker logs sk-it-caddy
          docker logs sk-it-buildkit
          docker logs sk-it-registry

  generated-code:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
      - run: pnpm install --frozen-lockfile
      # buf comes from the @bufbuild/buf npm package; plugins run remotely on buf.build with pinned versions.
      - run: pnpm gen
      - run: pnpm proto:lint
      - run: git diff --exit-code

  integration:
    name: Integration tests (Postgres, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [typescript, go]
    services:
      postgres:
        image: postgres:17@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
        env:
          POSTGRES_USER: shipkeep
          POSTGRES_PASSWORD: shipkeep
          POSTGRES_DB: shipkeep_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shipkeep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shipkeep:shipkeep@localhost:5432/shipkeep_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  browser:
    name: Browser acceptance (Chromium, HTTPS, Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The browser target builds the web app, which includes the installer artifacts.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: |
            agent/go.sum
            cli/go.sum
            lib/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The fixture always creates its own disposable PostgreSQL container.
      # Do not upload traces, HAR files or screenshots containing credentials.
      - run: pnpm test:browser
