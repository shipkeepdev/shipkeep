name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      - run: pnpm nx affected -t lint typecheck test build --parallel=3

  go:
    name: Go (lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: |
            agent/go.sum
            cli/go.sum
            lib/go.sum
      # golangci-lint v2 is required by .golangci.yml (config version 2). Keep `version` in sync with the local toolchain.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15
          working-directory: lib
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15
          working-directory: agent
          install-mode: none
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15
          working-directory: cli
          install-mode: none
      - run: go test -race -count=1 ./agent/... ./cli/... ./lib/...
      - name: Agent binary size budget (30 MB, PLAN M1.1)
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /tmp/shipkeep-agent ./agent/cmd/shipkeep-agent
          size=$(stat -c%s /tmp/shipkeep-agent)
          echo "shipkeep-agent is $size bytes"
          test "$size" -lt 31457280

  generated-code:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
      - run: pnpm install --frozen-lockfile
      # buf comes from the @bufbuild/buf npm package; plugins run remotely on buf.build with pinned versions.
      - run: pnpm gen
      - run: pnpm proto:lint
      - run: git diff --exit-code

  integration:
    name: Integration tests (Postgres, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [typescript, go]
    services:
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_USER: shipkeep
          POSTGRES_PASSWORD: shipkeep
          POSTGRES_DB: shipkeep_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shipkeep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shipkeep:shipkeep@localhost:5432/shipkeep_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
