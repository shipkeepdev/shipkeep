packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 blocks dependency build scripts by default. Allow only what the toolchain needs.
allowBuilds:
  # Argon2id password hashing (MIT), native Node binding.
  argon2: true
  '@bufbuild/buf': true
  '@prisma/engines': true
  prisma: true
  # Telemetry postinstall, never needed.
  '@scarf/scarf': false
  # Optional native builds pulled in by testcontainers (ssh2); the pure JS fallbacks are enough.
  cpu-features: false
  ssh2: false
  protobufjs: false
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lefthook: true
  nx: true
  '@nestjs/core': false
  unrs-resolver: false
  lmdb: false
  msgpackr-extract: false

# Supply-chain policy (THREAT_MODEL, "Security engineering requirements").
# New versions must be at least seven days old; the lockfile cannot be downgraded silently;
# sub-dependencies cannot resolve to git, tarball or other exotic sources.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Trust downgrades only matter for fresh publishes (takeover window); ignore them after 7 days.
trustPolicyIgnoreAfter: 10080
blockExoticSubdeps: true

# Security overrides for transitive dependencies. Remove each entry once the direct dependency updates.
overrides:
  # CVE-2026-113872: DoS via aborted request during async file filtering (via @nestjs/platform-express).
  multer: '>=2.5.0'
  # Dependabot advisories on development tooling only (nothing below ships in the control plane).
  # undici < 7.30.1, several high/medium advisories (via nx).
  'undici@>=7.0.0 <7.30.1': 7.30.1
  # vite 8.3.0 to 8.3.2, dev-server advisories (via @angular/build).
  'vite@>=8.3.0 <8.3.3': 8.3.5
  # uuid < 11.1.1 (via sockjs in webpack-dev-server); uuid 11 keeps the CommonJS v4 export it uses.
  'sockjs>uuid': 11.1.1
  # minimatch 7 to 11.0.0, GHSA-g3hv-75wg-m249, ReDoS-style amplification (via nx, eslint and others).
  'minimatch@>=7.0.0 <11.0.1': 11.0.3
  # glob 9 to 14.0.1, GHSA-3g3m-2fjr-6pw4, AbortSignal bypass (via nx and jest tooling).
  'glob@>=9.0.0 <14.0.2': 14.0.3

patchedDependencies:
  # Type declarations only: preserve readonly arrays/tuples until upstream fixes #2615.
  # https://github.com/openapi-ts/openapi-typescript/issues/2615
  openapi-typescript-helpers@0.1.0: patches/openapi-typescript-helpers@0.1.0.patch
