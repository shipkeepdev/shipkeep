packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 blocks dependency build scripts by default. Allow only what the toolchain needs.
allowBuilds:
  '@bufbuild/buf': true
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lefthook: true
  nx: true
  '@nestjs/core': false
  unrs-resolver: false
  lmdb: false
  msgpackr-extract: false

# Supply-chain policy (THREAT_MODEL, "Security engineering requirements").
# New versions must be at least seven days old; the lockfile cannot be downgraded silently;
# sub-dependencies cannot resolve to git, tarball or other exotic sources.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Trust downgrades only matter for fresh publishes (takeover window); ignore them after 7 days.
trustPolicyIgnoreAfter: 10080
blockExoticSubdeps: true

# Security overrides for transitive dependencies. Remove each entry once the direct dependency updates.
overrides:
  # CVE-2026-113872: DoS via aborted request during async file filtering (via @nestjs/platform-express).
  multer: '>=2.5.0'
