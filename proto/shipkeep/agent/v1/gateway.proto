// Transport between agents and the control plane (SPEC sections 3.1, 3.2, Appendix A).
//
// Agents open one outbound mTLS connection and keep the Connect stream alive (ADR 0002).

syntax = "proto3";

package shipkeep.agent.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "shipkeep/agent/v1/actions.proto";
import "shipkeep/agent/v1/exec.proto";

service AgentGatewayService {
  // Enrollment with a one-time join token. Server-side TLS only; the agent pins the CA afterwards.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // Certificate rotation at two thirds of validity. Requires the current client certificate.
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
  // Long-lived bidirectional stream carrying actions, updates, heartbeats and state.
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
  // Interactive exec frames for one ExecSession.
  rpc ExecStream(stream ExecStreamRequest) returns (stream ExecStreamResponse);
}

message EnrollRequest {
  // 32 random bytes, base64url. Single use, 15 minute TTL.
  string join_token = 1 [debug_redact = true];
  // PEM encoded CSR for an Ed25519 key generated on the node.
  string csr_pem = 2;
  NodeFacts facts = 3;
  string agent_version = 4;
}

message EnrollResponse {
  string cert_pem = 1;
  string ca_pem = 2;
  string node_id = 3;
  string organization_id = 4;
  string wireguard_ip = 5;
  uint64 lease_epoch = 6;
  // Ed25519 public key (PEM) used to verify confirmation tokens (SPEC section 3.6).
  string confirmation_public_key = 7;
  google.protobuf.Timestamp cert_not_after = 8;
}

message RenewCertificateRequest {
  string csr_pem = 1;
}

message RenewCertificateResponse {
  string cert_pem = 1;
  google.protobuf.Timestamp cert_not_after = 2;
}

// Agent to control plane.
message ConnectRequest {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    ActionUpdate action_update = 3;
    StateReport state_report = 4;
  }
}

// Control plane to agent.
message ConnectResponse {
  oneof msg {
    Welcome welcome = 1;
    ActionRequest action_request = 2;
    CancelAction cancel_action = 3;
    RoutingTable routing_table = 4;
    PeerList peer_list = 5;
    LeaseRenewal lease_renewal = 6;
    ConfigUpdate config_update = 7;
  }
}

// First message on every stream.
message Hello {
  string node_id = 1;
  string agent_version = 2;
  NodeFacts facts = 3;
  // Lease epoch the agent last held, for fencing (ADR 0008).
  uint64 lease_epoch = 4;
  // Version of the routing table in the agent's cache.
  uint64 routing_version = 5;
  // Version of the peer list in the agent's cache.
  uint64 peer_list_version = 6;
  // Operations still pending or running in the local journal, so the control plane can reconcile.
  repeated string in_flight_action_ids = 7;
}

message Heartbeat {
  google.protobuf.Timestamp sent_at = 1;
  uint64 lease_epoch = 2;
}

// Lifecycle states of an operation in the agent journal (SPEC section 3.4).
enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_PENDING = 1;
  OPERATION_STATE_RUNNING = 2;
  OPERATION_STATE_SUCCEEDED = 3;
  OPERATION_STATE_FAILED = 4;
  OPERATION_STATE_CANCELLED = 5;
  OPERATION_STATE_COMPENSATING = 6;
  OPERATION_STATE_COMPENSATED = 7;
}

// Sent on every transition of an operation.
message ActionUpdate {
  string action_id = 1;
  OperationState state = 2;
  // Current step name inside the action, for progress and resume.
  string step = 3;
  uint32 attempts = 4;
  // Human-readable error, already redacted by the agent.
  string error = 5;
  ActionResult result = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// Observed status of one managed container.
message ContainerStatus {
  string container_id = 1;
  string name = 2;
  State state = 3;
  bool healthy = 4;
  uint32 restart_count = 5;
  google.protobuf.Timestamp started_at = 6;
  int32 exit_code = 7;
  map<string, string> labels = 8;

  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_CREATED = 1;
    STATE_RUNNING = 2;
    STATE_PAUSED = 3;
    STATE_RESTARTING = 4;
    STATE_EXITED = 5;
    STATE_DEAD = 6;
  }
}

message VolumeStatus {
  string name = 1;
  uint64 size_bytes = 2;
}

// Full snapshot of what the agent observes on its node.
message StateReport {
  repeated ContainerStatus containers = 1;
  repeated VolumeStatus volumes = 2;
  uint64 routing_version = 3;
  uint64 peer_list_version = 4;
  uint64 lease_epoch = 5;
  google.protobuf.Timestamp observed_at = 6;
}

// Reply to Hello.
message Welcome {
  string node_id = 1;
  uint64 lease_epoch = 2;
  google.protobuf.Timestamp lease_expires_at = 3;
  google.protobuf.Duration heartbeat_interval = 4;
  google.protobuf.Timestamp server_time = 5;
}

// One action to execute. Exactly one field of `action` is set.
message ActionRequest {
  // UUIDv7.
  string action_id = 1;
  // Same key, same result: the agent returns the stored outcome without re-executing.
  string idempotency_key = 2;
  int64 deadline_unix_ms = 3;
  // Epoch the control plane believes the node holds. Mismatch means the agent must fence first.
  uint64 lease_epoch = 4;
  oneof action {
    EnsureNetwork ensure_network = 10;
    PullImage pull_image = 11;
    BuildImage build_image = 12;
    CreateContainer create_container = 13;
    StartContainer start_container = 14;
    StopContainer stop_container = 15;
    RemoveContainer remove_container = 16;
    EnsureVolume ensure_volume = 17;
    RemoveVolume remove_volume = 18;
    HealthCheck health_check = 19;
    UpsertRoute upsert_route = 20;
    RemoveRoute remove_route = 21;
    RunReleaseTask run_release_task = 22;
    ExecSession exec_session = 23;
    BackupVolume backup_volume = 24;
    RestoreVolume restore_volume = 25;
    DumpDatabase dump_database = 26;
    RestoreDatabase restore_database = 27;
    ConfigurePeers configure_peers = 28;
    CollectFacts collect_facts = 29;
    UpgradeAgent upgrade_agent = 30;
    StopStatefulWorkloads stop_stateful_workloads = 31;
    UpgradeControlPlane upgrade_control_plane = 32;
  }
}

message CancelAction {
  string action_id = 1;
  string reason = 2;
}

// Full routing table for the organization (ADR 0006). Agents cache it and serve from the cache
// when the control plane is unreachable.
message RoutingTable {
  uint64 version = 1;
  repeated Route routes = 2;
  google.protobuf.Timestamp generated_at = 3;
}

message PeerList {
  uint64 version = 1;
  repeated WireGuardPeer peers = 2;
}

message LeaseRenewal {
  uint64 epoch = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// Runtime configuration the control plane can adjust without a restart.
message ConfigUpdate {
  // One of debug, info, warn, error.
  string log_level = 1;
  google.protobuf.Duration heartbeat_interval = 2;
  google.protobuf.Duration reconcile_interval = 3;
  // Base URL of VictoriaLogs for log shipping (ADR 0011).
  string logs_endpoint = 4;
  // Base URL of VictoriaMetrics for metric shipping.
  string metrics_endpoint = 5;
}
