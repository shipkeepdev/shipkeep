<a class="skip-link" href="#main-content">Skip to content</a>
<div class="min-h-dvh md:grid md:grid-cols-[13rem_1fr]">
  <header class="flex flex-col border-b border-line bg-panel p-5 md:border-r md:border-b-0 md:p-6">
    <a routerLink="/" class="text-xl font-semibold text-ink no-underline">Shipkeep</a>
    <nav aria-label="Account" class="mt-5 flex flex-wrap gap-1 md:mt-8 md:flex-col">
      @if (session.profile()) {
        <a
          class="nav-link"
          routerLink="/account/security"
          routerLinkActive="selected"
          ariaCurrentWhenActive="page"
          >Account security</a
        >
      } @else {
        <a
          class="nav-link"
          routerLink="/auth/login"
          routerLinkActive="selected"
          ariaCurrentWhenActive="page"
          >Sign in</a
        >
        <a
          class="nav-link"
          routerLink="/auth/register"
          routerLinkActive="selected"
          ariaCurrentWhenActive="page"
          >Create account</a
        >
      }
      <a
        class="nav-link"
        routerLink="/auth/verify-email"
        routerLinkActive="selected"
        ariaCurrentWhenActive="page"
        >Verify email</a
      >
    </nav>
    <p class="mt-6 hidden text-sm leading-relaxed text-muted md:mt-auto md:block md:pt-12">
      Your own cloud<br />on your own servers.
    </p>
  </header>
  <main id="main-content" tabindex="-1" class="min-w-0 px-5 py-8 md:px-12 md:py-12 lg:px-16">
    <router-outlet />
  </main>
</div>
