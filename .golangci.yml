version: '2'

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
    - wrapcheck
  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      excludes: []
    revive:
      rules:
        - name: exported
          arguments: ['checkPrivateReceivers', 'sayRepetitiveInsteadOfStutters']
    wrapcheck:
      # Errors from our own modules are already wrapped where they originate.
      ignore-package-globs:
        - github.com/samuelmbabhazi/shipkeep/*
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Join(
        - errors.Unwrap(
  exclusions:
    generated: lax
    paths:
      - gen/
    rules:
      # Tests read fixtures and golden files from paths built at runtime.
      - path: _test\.go
        linters: [gosec]
        text: G304
      # Test helpers wrap nothing; wrapping would only obscure assertions.
      - path: _test\.go
        linters: [wrapcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/samuelmbabhazi/shipkeep
