version: '2'

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
    - wrapcheck
  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      excludes: []
    revive:
      rules:
        - name: exported
          arguments: ['checkPrivateReceivers', 'sayRepetitiveInsteadOfStutters']
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Join(
        - errors.Unwrap(
  exclusions:
    generated: lax
    paths:
      - gen/

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/samuelmbabhazi/shipkeep
